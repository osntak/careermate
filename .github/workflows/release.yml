name: Release

on:
  push:
    tags:
      - 'v*'
    branches:
      - 'release/v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            RELEASE_TAG="$GITHUB_REF_NAME"
          else
            RELEASE_TAG="${GITHUB_REF_NAME#release/}"
          fi
          [[ "$RELEASE_TAG" == v* ]] || { echo "::error::release ref must resolve to v*"; exit 1; }
          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"

      - name: Verify release and package version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${{ steps.release.outputs.tag }}"
          VER="${TAG#v}"
          echo "package.json=$PKG  release=$TAG"
          test "$PKG" = "$VER" || { echo "::error::release $TAG != package.json $PKG"; exit 1; }

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Dist bundle smoke
        run: npm run test:dist

      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "::notice::$PKG@$VER already exists; skipping publish"
          else
            npm publish --access public
          fi

      - name: Build release bundles
        run: npm run build:mcpb

      - name: Generate SBOM and checksums
        run: |
          test -s dist/careermate.mcpb
          test -s dist/careermate.zip
          cmp -s dist/careermate.mcpb dist/careermate.zip
          npm sbom --sbom-format cyclonedx > dist/sbom.cdx.json
          cd dist
          sha256sum careermate.mcpb careermate.zip sbom.cdx.json > SHA256SUMS.txt
          test -s SHA256SUMS.txt

      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --target "$GITHUB_SHA" --title "CareerMate $RELEASE_TAG" --generate-notes
          fi
          gh release upload "$RELEASE_TAG" \
            dist/careermate.mcpb \
            dist/careermate.zip \
            dist/sbom.cdx.json \
            dist/SHA256SUMS.txt \
            --clobber
