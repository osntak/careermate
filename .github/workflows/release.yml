name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Verify tag and package version
        run: |
          PKG="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          echo "package.json=$PKG  tag=$TAG"
          test "$PKG" = "$TAG" || { echo "::error::tag v$TAG != package.json $PKG"; exit 1; }

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Dist bundle smoke
        run: npm run test:dist

      - name: Publish to npm with provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          PKG="$(node -p "require('./package.json').name")"
          VER="$(node -p "require('./package.json').version")"
          if npm view "$PKG@$VER" version >/dev/null 2>&1; then
            echo "::notice::$PKG@$VER already exists; skipping publish"
          else
            npm publish --access public --provenance
          fi

      - name: Build release bundles
        run: npm run build:mcpb

      - name: Generate SBOM and checksums
        run: |
          test -s dist/careermate.mcpb
          test -s dist/careermate.zip
          cmp -s dist/careermate.mcpb dist/careermate.zip
          npm sbom --sbom-format cyclonedx > dist/sbom.cdx.json
          cd dist
          sha256sum careermate.mcpb careermate.zip sbom.cdx.json > SHA256SUMS.txt
          test -s SHA256SUMS.txt

      - name: Attach artifacts to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release create "$GITHUB_REF_NAME" --title "CareerMate $GITHUB_REF_NAME" --generate-notes
          fi
          gh release upload "$GITHUB_REF_NAME" \
            dist/careermate.mcpb \
            dist/careermate.zip \
            dist/sbom.cdx.json \
            dist/SHA256SUMS.txt \
            --clobber
